[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-intel"
version = "1.0.0"
description = "Multi-company financial health scoring and ranking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "yfinance>=0.2.40",
    "pyarrow>=14.0.0",
    "plotly>=5.18.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["features*", "scoring*", "ranking*", "src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["evaluation"]
addopts = "-q"
